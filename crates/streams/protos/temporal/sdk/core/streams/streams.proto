syntax = "proto3";

package coresdk.streams;
option ruby_package = "Temporalio::Internal::Bridge::Api::Streams";

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "temporal/api/common/v1/message.proto";
import "temporal/api/failure/v1/message.proto";
import "temporal/sdk/streams/v1/message.proto";
import "temporal/api/workflowservice/v1/stream_request_response.proto";

// The stream calls lang makes, served in process by the stream service against the configured
// store.
//
// Lang converts each value, hashes it and runs the payload codec before an append, and decodes
// each body after a read, so the service only ever moves encoded bodies. Every failure crosses as a
// `StreamFailure`.
service StreamService {
  // Appends one batch for one producer attempt. The batch lands whole and in order.
  rpc Append(AppendRequest) returns (AppendResponse);
  // Reads the records after a cursor, waiting up to `wait` for one when none is there.
  rpc Read(ReadRequest) returns (ReadResponse);
  // The cursor of the newest record of a stream.
  rpc Latest(LatestRequest) returns (LatestResponse);
  // Closes one stream. Later appends from producers are refused, and reads end once they have
  // delivered what the stream holds.
  rpc Close(CloseRequest) returns (CloseResponse);
  // Deletes every stream of one owner.
  rpc DeleteOwner(DeleteOwnerRequest) returns (DeleteOwnerResponse);
  // Drops the dedupe state of one producer attempt on one stream. Safe only once the attempt's
  // last append returned, since a retry of that append would then land twice.
  rpc RetireProducer(RetireProducerRequest) returns (RetireProducerResponse);
  // Waits until the stream notifications this process sent are out, for at most 10 seconds. A
  // notification goes in the background, so a process calls it before it stops.
  rpc FlushNotifications(FlushNotificationsRequest) returns (FlushNotificationsResponse);
  // Attaches a Workflow's reader of a stream to the stream's notifier as an idle callback. An idle
  // reader hears nothing until a read with `subscriber` finds no record and asks for one wake, so
  // a reader reads with `subscriber` and needs no call of its own. The process attaches each
  // subscription once and answers a repeat from memory, and the server takes a repeat from
  // another process as the same attach.
  rpc Subscribe(SubscribeRequest) returns (SubscribeResponse);
  // Detaches a Workflow's reader that stops before the stream ends.
  rpc Unsubscribe(UnsubscribeRequest) returns (UnsubscribeResponse);
  // Waits on the stream's notifier, for a client reader whose read came back empty. Returns when
  // the notifier's counter is above `after_counter`, when the stream closed, or at the server's
  // wait limit (`streamnotifier.pollMaxWait`). The poll starts the notifier, and the service reads
  // the stream once more just after it sends the poll, since a record that landed before the
  // notifier existed woke no one. A newer record there answers at once. The reader then reads
  // again. After the wait limit, that read finds records whose notification was lost, or comes back
  // empty again.
  rpc WaitForNotification(WaitForNotificationRequest) returns (WaitForNotificationResponse);
  // Describes a stream's notifier on the server, through the process's notifier client. Fails as
  // unsupported when the config turns no notifier client on.
  rpc DescribeStreamNotifier(temporal.api.workflowservice.v1.DescribeStreamNotifierRequest)
      returns (temporal.api.workflowservice.v1.DescribeStreamNotifierResponse);
  // Reads again the exact range an earlier read answered, for a positions-only Workflow reader on
  // replay, and checks it against that read's digest. Waits for nothing and checks no owner.
  rpc ReadRange(ReadRangeRequest) returns (ReadResponse);
  // Ends a positions-only reader's hold on a stream's records after a grace, so retention takes
  // them again.
  rpc ReleaseFloor(ReleaseFloorRequest) returns (ReleaseFloorResponse);
  // Reads a stream and the streams it links, in one order. Order within each stream is kept. A
  // linked stream's records come after its OPEN, and the linking stream's records after a JOIN
  // come after the linked stream reached the JOIN's point. Lang passes `state` back to resume.
  rpc Follow(FollowRequest) returns (FollowResponse);
  // Reads again the exact ranges an earlier Follow answered, for a positions-only follower on
  // replay, checks each against its digest, and gives the same records in the same order.
  rpc FollowRange(FollowRangeRequest) returns (FollowResponse);
  // What the store can do beyond the log every store gives, and its limits.
  rpc DescribeStore(DescribeStoreRequest) returns (DescribeStoreResponse);
  // Appends what one live activation of a Workflow published. Lang calls it before it completes
  // the activation, and fails the Workflow Task when the call fails.
  rpc PublishWorkflowTask(PublishWorkflowTaskRequest) returns (PublishWorkflowTaskResponse);
  // Drops one Worker's state for one run. Lang calls it for each eviction, and waits for it
  // before it completes the eviction activation.
  rpc RunEvicted(RunEvictedRequest) returns (RunEvictedResponse);
  // Drops one Worker's state for all its runs, and waits for the store calls the Worker's runs
  // left running. Lang calls it at Worker shutdown, after the last eviction. A run whose last live
  // completion ended its chain gets the close its eviction would give.
  rpc ShutdownWorker(ShutdownWorkerRequest) returns (ShutdownWorkerResponse);
}

// Which store holds a process's streams, and how to reach it. Lang builds one store from it and
// sends its stream calls there.
message StreamStoreConfig {
  oneof store {
    RedisStoreConfig redis = 1;
    MemoryStoreConfig memory = 2;
  }
  // Tells each stream's notifier on the server when the stream moves, after every append. That's
  // what wakes a reader that waits on the notifier. Off by default, since most streams have no
  // such reader and each notification costs a call. It turns on progress only. Closes reach the
  // notifier either way. A server without the stream notifier costs one call, and then the
  // process stops notifying. An append answers only after its notification went, or after a few
  // failed tries, so a producer that stops before then gets no answer and its retry notifies.
  bool notify_on_append = 3;
  // How many streams to keep a notifier for, dropping the least recently used. Zero uses 1000.
  uint32 max_notifiers = 4;
  reserved 5;
  reserved "notify_every_append";
  // How long a read waits for a Workflow that Temporal doesn't know yet, counted from the read's
  // first owner check. Until then the read answers empty, so a reader can start before its
  // owner does. After it the read fails as NOT_FOUND. Unset waits 60 seconds, and zero fails at
  // once.
  google.protobuf.Duration owner_start_grace = 6;
}

// Streams in a Redis or Redis Cluster that the service connects to itself.
message RedisStoreConfig {
  // One `redis://` or `rediss://` URL, or the seed nodes of a cluster. Credentials and TLS come
  // from the URL.
  repeated string urls = 1;
  bool cluster = 2;
  // Prepended to every key, so streams can share a Redis with other data and an ACL can scope
  // them. Empty uses `temporal-streams`.
  string key_prefix = 3;
  // How long a stream keeps a record. Unset keeps seven days.
  google.protobuf.Duration retention = 4;
  // How many reads may wait on one node at once, each on a connection of its own. Zero uses the
  // default.
  uint32 blocking_reads_per_node = 5;
  // How long a short call waits for its reply. Unset uses the default.
  google.protobuf.Duration response_timeout = 6;
  // How long a positions-only reader holds a stream's records after its last read. Unset uses
  // `retention`.
  google.protobuf.Duration floor_lease = 7;
  // How long a hold lasts after its reader released it. Unset keeps one day.
  google.protobuf.Duration floor_release_grace = 8;
  // Runs with no Lua, so the store keeps no producer state and no last position, and the service
  // takes their fallbacks. For tests of the fallbacks on a real store.
  bool plain = 10;
}

// Streams in this process's memory, for tests and local development. Nothing survives the
// process, and each connect makes a store of its own that shares no streams with another.
message MemoryStoreConfig {
  // A mask. Only the capabilities it sets stay, and its nonzero limits replace the store's.
  // Unset keeps every capability, so tests and users can try the weaker guarantees.
  StoreCapabilities capabilities = 1;
}

// What owns a stream. The owner decides when the stream closes.
enum StreamOwnerKind {
  STREAM_OWNER_KIND_UNSPECIFIED = 0;
  STREAM_OWNER_KIND_WORKFLOW = 1;
  // A standalone Activity run. It is a chain of one run, so its streams end with the run.
  STREAM_OWNER_KIND_ACTIVITY = 2;
  // An Activity that a Workflow run scheduled. It is a chain of one, keyed by the scheduling run
  // and the Activity id, so its streams end with the Activity.
  STREAM_OWNER_KIND_WORKFLOW_ACTIVITY = 3;
}

// One stream, a topic of an owner in a namespace.
message StreamAddress {
  string namespace = 1;
  StreamOwnerKind owner_kind = 2;
  // The owning Workflow, or the Workflow that scheduled a Workflow Activity. Empty for a
  // standalone Activity owner.
  string workflow_id = 3;
  // Pins the stream to the run chain that holds this run. Empty follows the chain that holds the
  // Workflow id when the call starts. For an Activity owner, the Activity run, and empty names
  // the newest run of the Activity id when the call starts. For a Workflow Activity owner, the
  // run that scheduled the Activity. It is required, since an Activity id names nothing across
  // runs.
  string run_id = 4;
  string topic = 5;
  // The owning Activity. Empty for a Workflow owner.
  string activity_id = 6;
}

// A Workflow's run chain. Its streams are keyed by its first run, so they follow
// Continue-as-New, and a new chain on the same Workflow id gets streams of its own. A standalone
// Activity run is a chain of one run, with the run as `first_run_id`. A Workflow Activity is a
// chain of one, with the scheduling run as `first_run_id`.
message ChainId {
  string namespace = 1;
  // Empty for a standalone Activity owner.
  string workflow_id = 2;
  string first_run_id = 3;
  // `UNSPECIFIED` is a Workflow owner, so a chain from before the Activity kind stays valid.
  StreamOwnerKind owner_kind = 4;
  // Empty for a Workflow owner.
  string activity_id = 5;
}

// A producer that names itself.
message NamedProducer {
  string producer_id = 1;
  // A process that restarts its work raises the attempt, which starts a new sequence and tells
  // readers that the earlier attempt's records are superseded. From one.
  int64 attempt = 2;
  // A Local Activity call (`__temporal_local_<n>@<run id>`) sets it to the `started_event_id` of
  // the `WorkflowTaskHistoryInfo` of the activation that scheduled it. Its records carry it, so a
  // reader learns when the call's task attempt never completed.
  int64 task_started_event_id = 3;
  // The `completed_started_event_ids` of that info, at most eight. The first record of each batch
  // carries them as `completed_tasks`.
  repeated int64 completed_started_event_ids = 4;
}

// An Activity attempt that writes. The service derives the producer id from it, so every SDK writes
// the same one, and the attempt is the Activity's.
message ActivityProducer {
  string workflow_id = 1;
  string run_id = 2;
  string activity_id = 3;
  int32 attempt = 4;
  // When the attempt started, as the Activity task gives it. With it, the service writes the
  // attempt as `started_unix_ms << 11 | min(attempt, 2047)`, so a later attempt and a reset
  // attempt both supersede an earlier one. Unset writes `attempt` as it is.
  google.protobuf.Timestamp attempt_started_time = 5;
}

// One record lang appends.
message AppendRecord {
  temporal.sdk.streams.v1.StreamRecordKind kind = 1;
  // Set on DATA, and optional on LINK, after lang's payload codec and external storage.
  temporal.api.common.v1.Payload body = 2;
  // The SHA-256 of the body as the payload converter made it, before the codec. A codec that
  // encrypts with a fresh nonce makes a retry's bytes differ, so a retry is recognized by this.
  // Empty when there is no body.
  bytes content_hash = 3;
  // Set on LINK only. A LINK's body is optional.
  temporal.sdk.streams.v1.StreamLink link = 4;
}

message AppendRequest {
  StreamAddress stream = 1;
  oneof producer {
    NamedProducer named = 2;
    ActivityProducer activity = 3;
  }
  // The first record's position within the producer attempt, from one.
  int64 sequence = 4;
  repeated AppendRecord records = 5;
  // The batch's identity, which the store compares when the producer repeats its newest batch.
  // Lang takes it before the codec, as the SHA-256 over each converted record as its length in 8
  // bytes big-endian, then its deterministic serialization. Deterministic serialization is stable
  // within one protobuf library only, so only the SDK that made a digest can repeat the batch and
  // dedupe. Another SDK's retry of the same batch fails as PRODUCER_DIVERGENT. Required.
  bytes digest = 6;
}

message AppendResponse {
  // The cursors of the batch's first and last records. A retry of the attempt's newest batch
  // answers with the cursors the batch got the first time.
  string first_cursor = 1;
  string last_cursor = 2;
}

message ReadRequest {
  StreamAddress stream = 1;
  // Read strictly after this cursor. Empty starts at the oldest record the stream retains, and
  // `$end` at whatever is appended after the read starts.
  string after = 2;
  // How long to wait for a record when none is there. Zero answers at once. The service waits at
  // most 60 seconds, the stream service contract's long-poll maximum.
  google.protobuf.Duration wait = 3;
  // How many stored records one answer holds at most. A synthesized supersession comes on top.
  // Zero lets the service choose. The service answers with at most 1,000 records.
  uint32 max_records = 4;
  // The `state` of the previous answer of the same read. Empty on its first call.
  bytes state = 5;
  reserved 6;
  reserved "arm";
  // For a positions-only Workflow reader: names the reader, as its run id and its subscription
  // id. The store holds the records after this read's start against retention for that holder,
  // until `ReleaseFloor` and its grace, or until the holder's lease passes with no read.
  string floor_holder = 7;
  // Set by a Workflow reader. An answer with no records that is not `done` attaches the reader
  // idle when this process has not, asks the notifier for one wake after the answer's
  // `wake_after`, and reads once more when a record landed before the attach. An answer with
  // records sends nothing, so a reader that keeps up costs the notifier nothing.
  ReadSubscriber subscriber = 8;
  // The most stored record bytes one answer holds past its first record. Zero puts no bound. A
  // Workflow reader that records its answers in History sets it, so an answer stays below the
  // server's blob size limit.
  uint64 max_bytes = 9;
}

// The Workflow reader that an idle read wakes, as `SubscribeRequest` names it.
message ReadSubscriber {
  string workflow_id = 1;
  string run_id = 2;
  string subscription_id = 3;
  uint32 generation = 4;
}

// A later attempt of a producer started writing. Readers synthesize it, and no store holds it.
message Supersession {
  string topic = 1;
  string producer_id = 2;
  int64 previous_attempt = 3;
  int64 attempt = 4;
}

message ReadRecord {
  // Hand this back as `after` to resume strictly past this record. A supersession carries the
  // cursor before the record that started the new attempt.
  string cursor = 1;
  oneof record {
    // As stored. Its body is still encoded.
    temporal.sdk.streams.v1.StreamRecord stored = 2;
    Supersession superseded = 3;
  }
  // An older attempt wrote it after this read delivered a newer attempt of the same producer.
  bool stale = 4;
}

message ReadResponse {
  repeated ReadRecord records = 1;
  // Where the next call resumes. Past the last record of this answer, or the request's cursor
  // when the answer is empty, with `$end` resolved.
  string cursor = 2;
  // Opaque to lang. Pass it to the next call of the same read, so attempts it has seen, the trim
  // watermark and the owner check carry over.
  bytes state = 3;
  // The owner's chain ended and the read delivered every record the stream retains. No later
  // call returns a record.
  bool done = 4;
  reserved 5;
  reserved "armed";
  // Set on an answer with no records and not `done`: the notification counter of the read's
  // position, zero for an empty stream. A notification with a higher counter names a record
  // after the position, so the reader waits for a counter above this one. One that landed before
  // the wait started counts.
  int64 wake_after = 6;
  // Set with `done` when the stream's topic was closed with a result. A chain close, when the
  // owner ended with no close, sets none of these three.
  temporal.api.common.v1.Payload close_result = 7;
  // Set with `done` when the stream's topic was closed with a failure.
  temporal.api.failure.v1.Failure close_failure = 8;
  // Set with `done` to the `closed_by` of the topic's first close.
  string closed_by = 9;
  // SHA-256 over the answer's records, as `ReadRange` checks it: per record its cursor, its stale
  // flag, and for a stored record its kind, producer, attempt, sequence and plaintext content
  // hash, or for a supersession its producer and both attempts. It leaves out the encoded body.
  bytes records_digest = 10;
  // The first run of the chain the read read. `ReadRange` takes it, so replay needs no describe.
  string chain_first_run_id = 11;
  // The cursor this answer reads strictly after, with `$end` resolved. With `cursor`, it is the
  // range `ReadRange` reads again.
  string start_cursor = 12;
}

message ReadRangeRequest {
  // The stream, as the read named it.
  StreamAddress stream = 1;
  // The read's `chain_first_run_id`.
  string chain_first_run_id = 2;
  // The read's `start_cursor` and its answer's `cursor`.
  string after = 3;
  string to = 4;
  // How many stored records the answer held, not counting supersessions.
  uint32 stored_records = 5;
  // The read's input `state`.
  bytes state = 6;
  // The answer's `records_digest`.
  bytes records_digest = 7;
  // As in `ReadRequest`, so a replay holds the records for its own run.
  string floor_holder = 8;
  // Set when the read's `after` was `$end`. That read looked up no record at the start it found,
  // and the replay must not either, or a newer attempt there reads as superseded.
  bool start_from_end = 9;
}

message ReleaseFloorRequest {
  StreamAddress stream = 1;
  string chain_first_run_id = 2;
  string floor_holder = 3;
}

message ReleaseFloorResponse {}

message FollowRequest {
  // The root stream.
  StreamAddress stream = 1;
  // The root cursor, on the first call. Later calls resume from `state` and ignore it.
  string after = 2;
  // The `state` of the previous answer. Empty on the first call.
  bytes state = 3;
  // How long to wait for a record when no source has one. The service waits at most 60 seconds.
  google.protobuf.Duration wait = 4;
  // How many stored records one answer holds at most, across all sources. Zero uses 100. The
  // service answers with at most 1,000.
  uint32 max_records = 5;
  // How deep links are followed. The root is depth zero. Zero uses 4. The first call's limits
  // hold for the whole follow, and `state` keeps them.
  uint32 max_depth = 6;
  // How many linked streams are open at once. Zero uses 16.
  uint32 max_open = 7;
  // For a positions-only follower: each source holds its records as `<floor_holder>/<source>`.
  string floor_holder = 8;
  // Set by a Workflow follower. An empty answer attaches each idle source idle and asks its
  // notifier for one wake after the source's `wake_after`.
  FollowSubscriber subscriber = 9;
}

// The Workflow that follows, so each idle source wakes it.
message FollowSubscriber {
  string workflow_id = 1;
  string run_id = 2;
  // Each source subscribes as `<subscription_prefix>.<source>`.
  string subscription_prefix = 3;
  uint32 generation = 4;
}

message FollowedRecord {
  // The source the item belongs to. Zero is the root. A SKIPPED link names the source that holds
  // the link.
  uint32 source = 1;
  oneof item {
    ReadRecord record = 2;
    LinkState link_state = 3;
  }
}

// What happened to a link, as the follower saw it.
message LinkState {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    // The linked stream is open, and its records follow.
    KIND_OPENED = 1;
    // The linked stream's segment ended: the stream closed, or it reached the JOIN's `until`. A
    // closed stream gives its close outcome.
    KIND_DONE = 2;
    // The linked stream can't be read. `error` says why. The follow goes on without it.
    KIND_UNAVAILABLE = 3;
    // The link was not followed. `reason` says why.
    KIND_SKIPPED = 4;
  }
  Kind kind = 1;
  temporal.sdk.streams.v1.StreamLink link = 2;
  temporal.api.common.v1.Payload close_result = 3;
  temporal.api.failure.v1.Failure close_failure = 4;
  // Set on UNAVAILABLE.
  StreamFailure error = 5;
  // Set on SKIPPED: `depth`, `limit`, `cycle`, `open` or `endpoint`. Set to `withdrawn` on a DONE
  // that a SUPERSEDED caused, since the attempt that wrote the OPEN was withdrawn. Set to
  // `resumed` on an OPENED where the same OPEN from a later attempt of that producer reads the
  // withdrawn segment on from its cursor.
  string reason = 6;
}

// A source that an answer's records name.
message FollowSource {
  uint32 number = 1;
  // The source that holds the source's link. Zero for the root and its links.
  uint32 parent = 2;
  uint32 depth = 3;
  StreamAddress stream = 4;
  // The link's name. Empty for the root.
  string name = 5;
}

// One read of one source, as `ReadRange` reads it again.
message SourceRange {
  uint32 source = 1;
  string chain_first_run_id = 2;
  string start_cursor = 3;
  string cursor = 4;
  uint32 stored_records = 5;
  bytes state_in = 6;
  bytes records_digest = 7;
  bool start_from_end = 8;
  // The read ended the source's stream, with this outcome.
  bool done = 9;
  temporal.api.common.v1.Payload close_result = 10;
  temporal.api.failure.v1.Failure close_failure = 11;
  // The read failed, so the source is unavailable. No other field but `source` is set.
  StreamFailure error = 12;
}

// An idle source that a Workflow follower waits on.
message SourceWake {
  uint32 source = 1;
  string subscription_id = 2;
  // The source's notification counter. A wake above it names a new record.
  int64 wake_after = 3;
}

message FollowResponse {
  repeated FollowedRecord records = 1;
  // The composite position: every source's cursor and read state, and the gates. Opaque to lang.
  bytes state = 2;
  // The root ended and every linked segment ended. No later call returns a record.
  bool done = 3;
  // Each source that `records` names.
  repeated FollowSource sources = 4;
  // Each read of this answer, in read order.
  repeated SourceRange ranges = 5;
  // On an empty answer of a Workflow follower, each idle source.
  repeated SourceWake wakes = 6;
  // The root's close outcome, with `done`.
  temporal.api.common.v1.Payload close_result = 7;
  temporal.api.failure.v1.Failure close_failure = 8;
  // SHA-256 over the order of `records`, as `FollowRange` checks it.
  bytes follow_digest = 9;
}

message FollowRangeRequest {
  // The root stream, as the Follow named it.
  StreamAddress stream = 1;
  // The `state` the Follow started from.
  bytes state_in = 2;
  // The Follow's `ranges`.
  repeated SourceRange ranges = 3;
  // The Follow's `follow_digest`.
  bytes follow_digest = 4;
  // As in `FollowRequest`.
  string floor_holder = 5;
  // The first Follow's limits, for a `state_in` that is empty. A non-empty `state_in` keeps them.
  uint32 max_depth = 6;
  uint32 max_open = 7;
}

message LatestRequest {
  StreamAddress stream = 1;
}

message LatestResponse {
  // Empty when the stream holds no record.
  string cursor = 1;
}

message CloseRequest {
  StreamAddress stream = 1;
  // What every callback attached to the stream's notifier completes with, after lang's payload
  // codec. The stream's notifier on the server closes once the store has. When set, a notifier
  // that doesn't take the close fails the call, and the service keeps trying in the background too.
  // Unset, the callbacks complete with a `binary/null` result, and the notifier close is retried
  // in the background.
  temporal.api.common.v1.Payload result = 2;
  // Closes the stream with a failure instead of `result`, after lang's failure converter and
  // codec. The callbacks complete as failed, or as canceled for a failure with canceled info.
  // A close carries a result or a failure, never both.
  temporal.api.failure.v1.Failure failure = 3;
  // Who closed the stream, opaque to the service. At most 256 bytes. The store keeps it with the
  // first close's outcome, and readers and refused appends see it, so a writer can tell a close by
  // its own run.
  string closed_by = 4;
}

// The first close of a topic, as a store keeps it. A later close of the topic keeps this one. A
// chain close, when the owner ended, keeps none. With `result` and `failure`, at most 1.5 MiB.
message StoredClose {
  temporal.api.common.v1.Payload result = 1;
  temporal.api.failure.v1.Failure failure = 2;
  string closed_by = 3;
}

message CloseResponse {}

message FlushNotificationsRequest {}

message FlushNotificationsResponse {}

message SubscribeRequest {
  // The stream to read. The reader's Workflow is in the stream's namespace.
  StreamAddress stream = 1;
  // The reader's Workflow and run.
  string workflow_id = 2;
  string run_id = 3;
  // Names the reader in its run. Lang derives it from the reader's call number, so replay gives
  // the same one. At most 256 bytes.
  string subscription_id = 4;
  // Counts the times the reader subscribed again after a wake with `resubscribe`. Each value is a
  // new attach, since the server answers a repeat of a dropped attach as done. Lang counts it from
  // the wakes, so replay gives the same one.
  uint32 generation = 5;
}

message SubscribeResponse {
  // The first run of the stream's run chain, which keys the notifier the reader attached to.
  string chain_first_run_id = 1;
  // Whether this call sent the attach. False when this process attached the reader before.
  bool attached = 2;
  // The notification counter of the stream's newest record, read after the attach landed, zero
  // for an empty stream. A record that landed before the notifier existed woke no one, so a
  // reader whose last read stopped below this counter reads once more before it sleeps.
  int64 newest_counter = 3;
}

message UnsubscribeRequest {
  // The stream, the reader's run, the subscription and its generation, as the last Subscribe
  // named them.
  StreamAddress stream = 1;
  string run_id = 2;
  string subscription_id = 3;
  uint32 generation = 4;
}

message UnsubscribeResponse {}

message WaitForNotificationRequest {
  // The stream the reader reads.
  StreamAddress stream = 1;
  // The `wake_after` of the read that came back empty.
  int64 after_counter = 2;
}

message WaitForNotificationResponse {
  // The highest counter the notifier has seen.
  int64 counter = 1;
  // The position that came with `counter`.
  string position = 2;
  // The wait reached its limit with no counter above `after_counter` and no close.
  bool timed_out = 3;
  // The stream closed. The reader reads to its end.
  bool closed = 4;
  // The result the stream closed with, when it gave one.
  temporal.api.common.v1.Payload close_result = 5;
  // The failure the stream closed with, when it closed with one.
  temporal.api.failure.v1.Failure close_failure = 6;
}

message DeleteOwnerRequest {
  string namespace = 1;
  StreamOwnerKind owner_kind = 2;
  // The Workflow whose streams go, for a Workflow owner. The streams of every Activity that the
  // Workflow scheduled go too.
  string workflow_id = 3;
  // The standalone Activity whose streams go, across all its runs, for an Activity owner.
  string activity_id = 4;
}

message DeleteOwnerResponse {
  // How much the delete removed, counted the store's own way, such as Redis keys. Only zero
  // means the same on every store: nothing was left to delete.
  uint64 deleted = 1;
}

message RetireProducerRequest {
  StreamAddress stream = 1;
  // The producer attempt whose dedupe state goes. Nothing it wrote is touched.
  oneof producer {
    NamedProducer named = 2;
    ActivityProducer activity = 3;
  }
}

// A producer attempt with no dedupe state left, or a stream that holds nothing, answers the same.
message RetireProducerResponse {}

message DescribeStoreRequest {}

message DescribeStoreResponse {
  // The short name the store mints into its cursors, such as `redis` or `memory`.
  string name = 1;
  StoreCapabilities capabilities = 2;
}

// What a store can do beyond the log every store gives. The service takes a fallback for each
// capability the store lacks, with the weaker guarantee the fallback names.
message StoreCapabilities {
  // The append checks the producer attempt's dedupe entry and the close flags in the same step.
  bool producer_state = 1;
  reserved 2, 3;
  // The store knows a topic's newest position after retention dropped every record.
  bool kept_last = 4;
  // A holder can keep records from retention.
  bool holds = 5;
  // One consumer can read every append in order.
  bool change_feed = 6;
  // A log per topic of each chain costs nothing much.
  bool cheap_logs = 7;
  // The store deletes every stream of one owner.
  bool delete_owner = 8;
  // The store lists the topics of one chain.
  bool topic_listing = 9;
  // A read can wait for the next record.
  bool long_poll = 10;
  // The next record's position is always the last one plus one.
  bool dense_positions = 11;
  // How long the store keeps records with no hold, when a positions-only reader can count on it.
  google.protobuf.Duration replay_horizon = 12;
  // The largest record the store takes, with its envelope.
  uint64 max_record_bytes = 13;
  // The most record bytes one append takes.
  uint64 max_batch_bytes = 14;
}

// One class per way a stream call can fail, so every lang maps the same failure to the same
// error.
enum StreamFailureKind {
  STREAM_FAILURE_KIND_UNSPECIFIED = 0;
  // The sequence was already written with different content.
  STREAM_FAILURE_KIND_PRODUCER_DIVERGENT = 1;
  // The sequence is below the next one the store expects for this producer attempt.
  STREAM_FAILURE_KIND_PRODUCER_STALE = 2;
  // The append may or may not have landed. Retrying the same batch is safe.
  STREAM_FAILURE_KIND_OUTCOME_UNKNOWN = 3;
  // The store refused the write, so nothing was written.
  STREAM_FAILURE_KIND_REFUSED = 4;
  // The stream is closed and refuses appends.
  STREAM_FAILURE_KIND_CLOSED = 5;
  // The cursor is not valid for this stream.
  STREAM_FAILURE_KIND_CURSOR = 6;
  // The cursor names a record the store no longer retains.
  STREAM_FAILURE_KIND_EXPIRED = 7;
  // The owner does not exist, or nothing is known about the stream.
  STREAM_FAILURE_KIND_NOT_FOUND = 8;
  // A stored record could not be read.
  STREAM_FAILURE_KIND_RECORD = 9;
  // The store failed or could not be reached.
  STREAM_FAILURE_KIND_STORAGE = 10;
  // This release or this store does not offer the capability.
  STREAM_FAILURE_KIND_UNSUPPORTED = 11;
  // The call's input breaks the contract, such as a missing member or a value out of range, so
  // the same call fails the same way. A lang built before this kind maps it, as any kind it
  // doesn't know, to a storage failure.
  STREAM_FAILURE_KIND_INVALID_ARGUMENT = 12;
  // A replay read found other records than the read it repeats: other content, another count
  // or another end. Lang reports it as nondeterminism.
  STREAM_FAILURE_KIND_REPLAY_MISMATCH = 13;
  // A replay read found that the store no longer holds the range the read it repeats got
  // (REC-01), such as records that retention trimmed or a deleted log.
  STREAM_FAILURE_KIND_REPLAY_RANGE_LOST = 14;
}

message StreamFailure {
  StreamFailureKind kind = 1;
  string message = 2;
  // The cursor of the record that failed, for RECORD.
  string cursor = 3;
  // For CLOSED, the `closed_by` of the topic's first close. Empty when the owner's chain closed
  // or the close named no one.
  string closed_by = 4;
}

// The calls below are what the service asks of a store, below owner checks, cursors and
// supersession. They name chains and store positions, not addresses and cursors.

message StoreAppendRequest {
  ChainId chain = 1;
  string topic = 2;
  string producer_id = 3;
  int64 attempt = 4;
  int64 sequence = 5;
  // The batch's fingerprint, compared on a retry of the attempt's newest batch.
  bytes digest = 6;
  // Serialized `temporal.sdk.streams.v1.StreamRecord`s, ready to store.
  repeated bytes records = 7;
}

message StoreAppendResponse {
  string first_position = 1;
  string last_position = 2;
  reserved 3;
  reserved "arm";
}

message StoreReadRequest {
  ChainId chain = 1;
  string topic = 2;
  // Read strictly after this position. Empty starts at the oldest retained record.
  string after_position = 3;
  google.protobuf.Duration wait = 4;
  uint32 max_records = 5;
  reserved 6;
  reserved "arm";
}

message StoredRecord {
  string position = 1;
  // A serialized `temporal.sdk.streams.v1.StreamRecord`.
  bytes record = 2;
}

message StoreReadResponse {
  repeated StoredRecord records = 1;
  // The chain or this topic is marked closed.
  bool closed = 2;
  reserved 3;
  reserved "armed";
  // The topic's first close, when it was closed as a topic. Unset for a chain close.
  StoredClose close = 4;
}

message StoreLatestRequest {
  ChainId chain = 1;
  string topic = 2;
}

message StoreLatestResponse {
  // Empty when the topic holds no record.
  string position = 1;
}

// One live activation's stream output and the facts of its run, sent before lang completes the
// activation. Lang sends none while it replays, since the records are in the store already. It
// sends one for an activation with records or with a terminal command.
message PublishWorkflowTaskRequest {
  string namespace = 1;
  // Names the lang Worker. The service keys each run's state by the Worker and the run, so two
  // Workers in one process never share counters.
  string worker_id = 2;
  string task_queue = 3;
  string workflow_type = 4;
  string workflow_id = 5;
  string run_id = 6;
  // From `InitializeWorkflow`. Empty means the run starts its chain.
  string first_execution_run_id = 7;
  // A cron schedule starts the chain's next run when this one completes or fails.
  bool cron = 8;
  // A failure with a retry policy can go on in the same chain.
  bool has_retry_policy = 9;
  // The three fields of the activation's `WorkflowTaskHistoryInfo`.
  int64 task_started_event_id = 10;
  uint32 failed_attempts = 11;
  repeated int64 completed_started_event_ids = 12;
  // In publish order across topics.
  repeated OutputRecord records = 13;
  // The first terminal command of the completion, which is the one Core keeps.
  WorkflowTerminalCommand terminal_command = 14;
}

// One record a Workflow published.
message OutputRecord {
  string topic = 1;
  // DATA, FINISH or LINK.
  temporal.sdk.streams.v1.StreamRecordKind kind = 2;
  // The value on DATA, after lang's payload codec. Absent on FINISH. Optional on LINK.
  temporal.api.common.v1.Payload body = 3;
  // The SHA-256 of the body as the payload converter made it, before the codec. Set with a body.
  // The service builds each topic's batch digest from these, so a repeat of a batch matches
  // whatever the codec made of the bodies.
  bytes content_hash = 4;
  // Set on LINK only.
  temporal.sdk.streams.v1.StreamLink link = 5;
}

enum WorkflowTerminalCommand {
  WORKFLOW_TERMINAL_COMMAND_UNSPECIFIED = 0;
  WORKFLOW_TERMINAL_COMMAND_COMPLETE = 1;
  WORKFLOW_TERMINAL_COMMAND_FAIL = 2;
  WORKFLOW_TERMINAL_COMMAND_CANCEL = 3;
  WORKFLOW_TERMINAL_COMMAND_CONTINUE_AS_NEW = 4;
}

message PublishWorkflowTaskResponse {
  // The topics whose records the service dropped, since the store has closed them. The other
  // topics went on.
  repeated string dropped_topics = 1;
}

message RunEvictedRequest {
  string worker_id = 1;
  string run_id = 2;
  // The eviction reason is `WorkflowExecutionEnding`. Then the service can close the run's chain.
  bool workflow_execution_ending = 3;
}

message RunEvictedResponse {}

message ShutdownWorkerRequest {
  string worker_id = 1;
}

message ShutdownWorkerResponse {}
