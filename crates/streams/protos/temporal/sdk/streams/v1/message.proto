syntax = "proto3";

package temporal.sdk.streams.v1;

option ruby_package = "Temporalio::Internal::Bridge::Api::StreamRecord";

import "temporal/api/common/v1/message.proto";

// One entry in a stream. The record is the wire format: stores keep it
// serialized as is and readers in every language decode the same bytes.
//
// Field numbers and enum values are part of the stored format. The package
// name is not, so this message can move to another package without a data
// change.
message StreamRecord {
    // The value the producer published. Lang runs it through the payload
    // codec and external storage before it reaches any store, so a store and
    // Core see only the encoded payload.
    temporal.api.common.v1.Payload body = 1;
    // Provenance stamped by the SDK, such as the plaintext content hash.
    map<string, temporal.api.common.v1.Payload> metadata = 2;
    // The topic the record was published on.
    string topic = 3;
    // How to read this record. Unspecified is read as DATA.
    StreamRecordKind kind = 4;
    // Who wrote the record. Empty when the owning Workflow did.
    string producer_id = 5;
    // The producer's attempt. Readers treat a later attempt by the same
    // producer as superseding what the earlier one wrote.
    int64 attempt = 6;
    // The producer's position within its attempt, starting at one, or zero
    // when it does not number its records.
    int64 sequence = 7;
    // Set by a Workflow run's own producer only: the WorkflowTaskStarted
    // event id of the task attempt that wrote the record.
    int64 task_started_event_id = 9;
    // Set by a Workflow run's own producer, on the first record of each
    // batch: the WorkflowTaskStarted event ids of the run's last completed
    // tasks, newest first, at most eight. The first is the attempt's prefix.
    // A trailing zero means the list goes back to the run's start. A reader
    // learns from it whether an earlier attempt it delivered completed.
    repeated int64 completed_tasks = 10;
}

// What a record means to a reader.
enum StreamRecordKind {
    // Read as DATA.
    STREAM_RECORD_KIND_UNSPECIFIED = 0;
    // A value the producer published; `body` carries it.
    STREAM_RECORD_KIND_DATA = 1;
    // The producer named by `producer_id` writes nothing more on `topic`.
    // Says nothing about that producer's outcome and does not end the stream.
    STREAM_RECORD_KIND_FINISH = 2;
    // A reader synthesizes SUPERSEDED with this value and never stores it, so
    // no stored kind may take it.
    reserved 3;
    // Kept for links between streams.
    reserved 4;
    // Ends `topic` for every reader, or every topic of the chain when `topic`
    // is empty. Readers drop every record after the first one. On a store
    // without close flags, producers and the owner's Core write it to close.
    STREAM_RECORD_KIND_CLOSE = 5;
    // Names `topic` in the chain's control log `_chain`, so a closer finds the
    // chain's topics on a store that can't list them. Topic readers skip it.
    STREAM_RECORD_KIND_TOPIC = 6;
}
