syntax = "proto3";

// The messages of the crate's own extension calls, next to the five Stream service operations.
// Lang sends them through the bridge's generic extension call, by the method name in each
// comment. Field numbers are part of the contract with every SDK.
package temporal.sdk.streams.v1;

import "google/protobuf/duration.proto";
import "temporal/api/streamservice/v1/stream_service.proto";

// The settings of the native Stream extension, on the server's Stream service. The connection
// comes from the Worker or the client, so it needs no address.
message NativeStreamConfig {
    // The backend name that lang registered this extension under. Empty is `native`. The crate
    // puts it in each StreamRef it builds.
    string backend = 1;
    // The Retention of a create that gives none. Empty leaves it to the server's default.
    google.protobuf.Duration retention = 2;
}

// The settings of the Redis Stream extension. Lang builds it from the plugin options.
message RedisStreamConfig {
    // One URL, or the seed URLs of a cluster. Credentials and TLS come from the URL.
    repeated string urls = 1;
    bool cluster = 2;
    // Empty is `temporal-streams`.
    string key_prefix = 3;
    // The default Retention of a new Stream. Empty is 7 days.
    google.protobuf.Duration retention = 4;
    // How long an open Workflow-owned Stream stays after its last write. Empty is 90 days.
    google.protobuf.Duration safety_ttl = 5;
    // When above zero, each Workflow flush runs `WAIT durable_writes <durable_timeout>`.
    int32 durable_writes = 6;
    // Empty is 1 s.
    google.protobuf.Duration durable_timeout = 7;
    // Zero is 256.
    int32 blocking_reads_per_node = 8;
    // Empty is 5 s.
    google.protobuf.Duration response_timeout = 9;
    // The backend name that lang registered this extension under. The crate puts it in each
    // StreamRef it builds, such as the one in a create answer.
    string backend = 10;
}

// Method `BufferWorkflowCalls`, synchronous. Lang calls it at the end of each Activation of a
// run, with the calls that Workflow code made in that Activation, in order. On replay, lang
// sends only the creates and the closes. The crate writes the buffer in `before_complete` and
// sends the closes in `after_complete`.
message BufferWorkflowCallsRequest {
    string run_id = 1;
    // A retry run only: the previous run. The crate puts it on each create and append of the
    // run, so the first one on each Stream withdraws the previous run's Records.
    string withdraw_run = 2;
    repeated WorkflowCall calls = 3;
    // Set on the run's last call when the server goes on with the Run Chain, which is a failure
    // that the retry policy retries, or any cron run. The crate then skips the closes that have
    // `when_run_closes`.
    bool chain_continues = 4;
}

message WorkflowCall {
    oneof call {
        temporal.api.streamservice.v1.CreateStreamRequest create = 1;
        // The crate sets the Producer, the sequence and the History facts.
        temporal.api.streamservice.v1.AppendRecordsRequest append = 2;
        // The crate sets the Producer and the History facts.
        temporal.api.streamservice.v1.CloseStreamRequest close = 3;
    }
    // For a close only: send it only when the server accepts a completion that closes the run.
    // `auto_close` sets it.
    bool when_run_closes = 4;
}

message BufferWorkflowCallsResponse {
}

// Method `FlushRunBuffer`, asynchronous. Lang calls it before it runs a Local Activity, also
// before each retry that Core runs in the same task. The crate writes the run's buffered
// creates and appends in the epoch of the Workflow Task that dispatched the Local Activity, so
// the run's Records come before the Local Activity's. Closes still wait for an accepted
// completion. The task's completion writes only what came later, with the numbering going on,
// and sends the task's withdrawal facts to each Stream this call wrote. A Local Activity of a
// task that already completed, or of a task older than an earlier flush, writes nothing. When
// the call fails, the run's next completion fails with the same error, so the retry withdraws
// what was written. Lang then fails the Local Activity attempt.
message FlushRunBufferRequest {
    string namespace = 1;
    string run_id = 2;
    // `ActivityTask.Start.workflow_task` (field 20) of the Local Activity.
    temporal.api.streamservice.v1.WorkflowTaskEpoch workflow_task = 3;
    // How long the write may take. Empty is 10 s.
    google.protobuf.Duration timeout = 4;
}

message FlushRunBufferResponse {
    // The Records the call wrote. Zero when the run had nothing buffered.
    int32 records = 1;
}

// Method `OpenWriter`, asynchronous. A writer for an Activity or a client Producer, which keeps
// its epoch and `sequence` order. A writer of an Activity attempt above 1 first sends an empty
// batch, so the new epoch withdraws the earlier attempt's Records.
message OpenWriterRequest {
    string namespace = 1;
    temporal.api.streamservice.v1.StreamRef stream = 2;
    temporal.api.streamservice.v1.Producer producer = 3;
    // The interval flush and its buffer limit are gone. Lang buffers on its own.
    reserved 4, 7;
    reserved "batch_interval", "max_buffered_records";
    // A write sends at most this many Records in one batch. Zero is 1000.
    int32 max_batch_size = 5;
    // How long a write retries a Store failure. Empty is 10 s.
    google.protobuf.Duration max_retry_duration = 6;
}

message OpenWriterResponse {
    uint64 writer_id = 1;
}

// Method `WriteRecords`, asynchronous. Appends Records at once for an open writer and answers
// when they are in the Store. It keeps the writer's Producer epoch and `sequence` order, and a
// Store failure resends the same batch, so it goes in once. Records past the Store's batch limit
// go as more batches, in order. An awaited publish of an Activity or a client uses this call. A
// failure after the Store retries fails the writer, since the batch may be in the Store.
message WriteRecordsRequest {
    uint64 writer_id = 1;
    repeated temporal.api.streamservice.v1.AppendRecord records = 2;
}

message WriteRecordsResponse {
    // The offsets of the first and the last Record. Zero when the request has no Record.
    int64 first_offset = 1;
    int64 last_offset = 2;
}

// Method `CloseWriter`, asynchronous. Waits for a write in flight, then drops the writer. It
// doesn't close the Stream. It fails with the writer's error if a write failed.
message CloseWriterRequest {
    uint64 writer_id = 1;
}

message CloseWriterResponse {
    // The offset of the newest Record the writer wrote. Zero if it wrote none.
    int64 last_offset = 1;
}

// Method `CloseWriters`, asynchronous. Drops every open writer, for example when the plugin's
// client or Worker shuts down.
message CloseWritersRequest {
}

message CloseWritersResponse {
    // The writers that had failed.
    int32 failed = 1;
}

// Method `DrainCloses`, asynchronous. Waits for the closes that `after_complete` started, for
// example at Worker shutdown.
message DrainClosesRequest {
    // Empty is 10 s.
    google.protobuf.Duration timeout = 1;
}

message DrainClosesResponse {
    // The closes still running when the timeout passed.
    int32 pending = 1;
}

// The details of a failed call, in the error's details bytes.
message StreamErrorDetails {
    // A token for lang, such as `stream_closed`, `stream_fenced` or `stream_format_too_new`.
    string reason = 1;
}
