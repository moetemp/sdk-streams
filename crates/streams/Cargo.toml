[package]
name = "temporalio-streams"
version = "0.1.0"
edition = "2024"
rust-version = "1.88.0"
authors = ["Temporal Technologies Inc. <sdk@temporal.io>"]
license-file = { workspace = true }
description = "The Stream runtime for Temporal SDKs: the Stream service on Redis"
homepage = "https://temporal.io/"
repository = "https://github.com/moetemp/sdk-streams"
keywords = ["temporal", "workflow", "streams"]
categories = ["development-tools"]

[features]
default = ["tls-ring"]
# The TLS providers of the sdk-rust crates. A FIPS build takes `tls-aws-lc` with no default
# features, so no crate in the build pulls `ring`.
tls-ring = [
    "temporalio-sdk-core/tls-ring",
    "temporalio-common/tls-ring",
    "temporalio-client/tls-ring",
]
tls-aws-lc = [
    "temporalio-sdk-core/tls-aws-lc",
    "temporalio-common/tls-aws-lc",
    "temporalio-client/tls-aws-lc",
]
# A FIPS build: `tls-aws-lc`, and `aws-lc-rs` in FIPS mode, so the shared rustls provider links
# `aws-lc-fips-sys`.
fips = ["tls-aws-lc", "dep:aws-lc-rs"]

[dependencies]
async-trait = "0.1"
bytes = "1"
# Only under `fips`. The crate never calls it. Its `fips` feature switches the one `aws-lc-rs` in
# the build into FIPS mode.
aws-lc-rs = { version = "1", features = ["fips"], optional = true }
crc16 = "0.4"
parking_lot = "0.12"
prost = { workspace = true }
prost-types = { workspace = true }
# TLS uses the rustls provider that the process installs, the same one Core uses.
redis = { version = "1.7", default-features = false, features = [
    "cluster-async",
    "connection-manager",
    "script",
    "streams",
    "tokio-rustls-comp",
] }
temporalio-client = { workspace = true }
temporalio-common = { workspace = true }
temporalio-sdk-core = { workspace = true }
thiserror = { workspace = true }
tonic = { workspace = true }
tokio = { version = "1.47", default-features = false, features = ["rt", "sync", "time"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
tracing = "0.1"

[build-dependencies]
tonic-prost-build = { workspace = true }

[dev-dependencies]
# Core's mock Worker, so a test drives the hooks as a bridge's Worker does.
temporalio-sdk-core = { workspace = true, features = ["test-utilities"] }
serde_json = { workspace = true }
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
