[package]
name = "temporalio-streams"
version = "0.1.0"
edition = "2024"
rust-version = "1.88.0"
authors = ["Temporal Technologies Inc. <sdk@temporal.io>"]
license-file = { workspace = true }
description = "The stream runtime for Temporal SDKs: the store trait, stores and record helpers"
homepage = "https://temporal.io/"
repository = "https://github.com/moetemp/sdk-streams"
keywords = ["temporal", "workflow", "streams"]
categories = ["development-tools"]

[features]
default = ["envconfig", "tls-ring"]
# The TLS providers and the config loader of the sdk-rust crates. A FIPS build takes
# `tls-aws-lc` with no default features, so no crate in the build pulls `ring`.
tls-ring = ["temporalio-client/tls-ring", "temporalio-common/tls-ring"]
tls-aws-lc = ["temporalio-client/tls-aws-lc", "temporalio-common/tls-aws-lc"]
envconfig = ["temporalio-client/envconfig", "temporalio-common/envconfig"]
# A FIPS build: `tls-aws-lc`, and `aws-lc-rs` in FIPS mode, so the shared rustls provider links
# `aws-lc-fips-sys`. Take it with no default features, so no crate in the build pulls `ring`.
fips = ["tls-aws-lc", "dep:aws-lc-rs"]
serde_serialize = ["dep:serde", "temporalio-common/serde_serialize"]
# The Redis store. Off by default, so a build that needs only the trait takes no Redis client.
# TLS uses the rustls provider the process installs, the same one Core uses.
redis = ["dep:redis", "dep:crc16"]
# The archive on object storage: S3 and S3-compatible stores. The local-file archive needs no
# feature.
archive = ["dep:object_store", "dep:futures-util"]
# The PostgreSQL store. TLS uses the rustls provider the process installs, as the Redis store does.
postgres = [
    "dep:deadpool-postgres",
    "dep:rustls",
    "dep:rustls-native-certs",
    "dep:tokio-postgres",
    "dep:tokio-postgres-rustls",
]

[dependencies]
async-trait = "0.1"
bytes = "1"
# Only under `fips`. The crate never calls it. Its `fips` feature switches the one `aws-lc-rs` in
# the build into FIPS mode.
aws-lc-rs = { version = "1", features = ["fips"], optional = true }
crc16 = { version = "0.4", optional = true }
deadpool-postgres = { version = "0.14", optional = true }
futures-util = { version = "0.3", optional = true, default-features = false }
gethostname = "1.0.2"
lru = "0.18"
object_store = { version = "0.14", optional = true, default-features = false, features = ["aws"] }
parking_lot = "0.12"
prost = { workspace = true }
prost-types = { workspace = true }
redis = { version = "1.7", optional = true, default-features = false, features = [
    "cluster-async",
    "connection-manager",
    "script",
    "streams",
    "tokio-rustls-comp",
] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["std"] }
rustls-native-certs = { version = "0.8", optional = true }
serde = { workspace = true, optional = true }
sha2 = "0.10"
temporalio-client = { workspace = true }
temporalio-common = { workspace = true }
thiserror = { workspace = true }
tonic = { workspace = true }
tokio = { version = "1.47", default-features = false, features = ["macros", "rt", "sync", "time"] }
tokio-postgres = { version = "0.7", optional = true }
tokio-postgres-rustls = { version = "0.14", optional = true }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
tracing = "0.1"

[build-dependencies]
tonic-prost-build = { workspace = true }

[dev-dependencies]
# Core's mock Worker, so the tests drive the publish calls as lang does around real activations.
temporalio-sdk-core = { workspace = true, features = ["test-utilities"] }
assert_matches = "1.5"
futures-util = { version = "0.3", default-features = false }
parking_lot = "0.12"
rstest = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tonic = { workspace = true }
serde_json = { workspace = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
tokio = { version = "1.47", features = [
    "io-util",
    "macros",
    "net",
    "rt",
    "rt-multi-thread",
    "test-util",
    "time",
] }
url = "2.5"
uuid = { version = "1.18", default-features = false, features = ["v4"] }

[lints]
workspace = true
