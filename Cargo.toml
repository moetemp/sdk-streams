[workspace]
members = ["crates/streams"]
resolver = "3"

[workspace.package]
license = "MIT"
license-file = "LICENSE.txt"

[workspace.dependencies]
prost = "0.14"
# The well-known types the sdk-rust crates use, under the name the generated code expects.
prost-types = { version = "0.7", package = "prost-wkt-types" }
serde_json = "1.0"
thiserror = "2"
tonic = { version = "0.14.6", default-features = false }
tonic-prost-build = "0.14.6"
# A lang bridge patches it to the copy in its `sdk-core` submodule, so that each type exists once.
temporalio-common = { version = "1.1", default-features = false }

[workspace.lints.rust]
unreachable_pub = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
