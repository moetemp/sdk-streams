name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt, clippy and the API proto copy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-features --tests -- -D warnings
      - run: >-
          cargo clippy --workspace --no-default-features --features tls-aws-lc,redis --tests
          -- -D warnings
      - name: The API proto copy matches the pinned sdk-rust
        run: scripts/sync-api-protos.sh && git diff --exit-code

  memory:
    name: memory store and Core mock tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  fips:
    name: FIPS build takes no ring
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --no-default-features --features fips,redis
      # Normal and build edges only, since the tests' own dependencies may take `ring`.
      - run: |
          tree=$(cargo tree -e normal,build --no-default-features --features fips,redis \
            -i ring --target all 2>/dev/null || true)
          if [ -n "$tree" ]; then echo "$tree"; exit 1; fi

  redis:
    name: Redis store tests (standalone and cluster)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y redis-server
      - run: crates/streams/scripts/redis-test-servers.sh >> "$GITHUB_ENV"
      - run: cargo test -p temporalio-streams --all-features -- --test-threads=8
