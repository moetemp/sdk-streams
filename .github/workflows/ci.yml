name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt, clippy and the API proto copy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-features --tests -- -D warnings
      - run: >-
          cargo clippy --workspace --no-default-features
          --features tls-aws-lc,redis,postgres,archive --tests -- -D warnings
      - name: The API proto copy matches the pinned sdk-rust
        run: scripts/sync-api-protos.sh && git diff --exit-code
      - name: The stream API copy matches its moetemp/api commit
        run: scripts/sync-stream-api.sh && git diff --exit-code

  memory:
    name: memory store and Core mock tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  fips:
    name: FIPS build takes no ring
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
      - run: >-
          cargo build --workspace --no-default-features --features fips,redis,postgres,archive
      # Normal and build edges only, since the tests' own dependencies may take `ring`.
      - run: |
          tree=$(cargo tree -e normal,build --no-default-features \
            --features fips,redis,postgres,archive -i ring --target all 2>/dev/null || true)
          if [ -n "$tree" ]; then echo "$tree"; exit 1; fi

  redis:
    name: Redis store tests (standalone and cluster)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y redis-server
      - run: crates/streams/scripts/redis-test-servers.sh >> "$GITHUB_ENV"
      - run: cargo test -p temporalio-streams --all-features -- --test-threads=8

  postgres:
    name: PostgreSQL store tests (14, 17 and PgBouncer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
      - run: crates/streams/scripts/postgres-test-server.sh | sed 's/^export //' >> "$GITHUB_ENV"
      - run: cargo test -p temporalio-streams --all-features -- --test-threads=8

  archive:
    name: S3 archive tests on MinIO
    runs-on: ubuntu-latest
    env:
      AWS_ENDPOINT_URL: http://127.0.0.1:9000
      AWS_ALLOW_HTTP: "true"
      AWS_ACCESS_KEY_ID: streams
      AWS_SECRET_ACCESS_KEY: streams-secret
      AWS_REGION: us-east-1
      STREAMS_S3_URL: s3://streams-archive/ci
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
      - run: |
          docker run -d --name minio -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER="$AWS_ACCESS_KEY_ID" \
            -e MINIO_ROOT_PASSWORD="$AWS_SECRET_ACCESS_KEY" cgr.dev/chainguard/minio server /data
          for _ in $(seq 50); do
            curl -fs http://127.0.0.1:9000/minio/health/ready && break
            sleep 0.2
          done
          aws s3 mb s3://streams-archive
      - run: cargo test -p temporalio-streams --all-features -- --test-threads=8
