name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt, clippy and the API proto copies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: clippy, rustfmt
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-features --tests -- -D warnings
      - run: >-
          cargo clippy --workspace --no-default-features
          --features tls-aws-lc,redis --tests -- -D warnings
      - name: The API proto copy matches the pinned sdk-rust
        run: scripts/sync-api-protos.sh && git diff --exit-code
      - name: The stream API copy matches its moetemp/api commit
        run: scripts/sync-stream-api.sh && git diff --exit-code
      - name: The Nexus API copy matches its moetemp/api commit
        run: scripts/sync-nexus-api.sh && git diff --exit-code
      - name: The API copies share no path and no name with the pinned sdk-rust
        run: scripts/check-api-overlap.sh

  memory:
    name: memory store and Core mock tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  fips:
    name: FIPS build takes no ring
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
      - run: >-
          cargo build --workspace --no-default-features --features fips,redis
      # Normal and build edges only, since the tests' own dependencies may take `ring`.
      - run: |
          tree=$(cargo tree -e normal,build --no-default-features \
            --features fips,redis -i ring --target all 2>/dev/null || true)
          if [ -n "$tree" ]; then echo "$tree"; exit 1; fi

  redis:
    name: Redis store tests (standalone and cluster)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
      # The documented ACL names `client|setinfo`, which the distro's Redis 7.0 doesn't know.
      - name: Install Redis from the Redis apt repo
        run: |
          curl -fsSL https://packages.redis.io/gpg \
            | sudo gpg --dearmor -o /usr/share/keyrings/redis-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/redis-archive-keyring.gpg]" \
            "https://packages.redis.io/deb $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/redis.list
          sudo apt-get update && sudo apt-get install -y redis
      - run: crates/streams/scripts/redis-test-servers.sh >> "$GITHUB_ENV"
      - run: cargo test -p temporalio-streams --all-features -- --test-threads=8
        env:
          STREAMS_REQUIRE: redis
          STREAMS_REDIS_CLUSTER_ADMIN: "1"

  optional-restore:
    name: The optional layers' restore commits copy 4aebbd4a
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: scripts/check-optional-restore.py
